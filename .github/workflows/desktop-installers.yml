name: Build Ironpath desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  package:
    name: ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            command: pnpm exec electron-builder --publish never --mac
          - os: windows-latest
            label: Windows
            command: pnpm exec electron-builder --publish never --win

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ironpath-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
