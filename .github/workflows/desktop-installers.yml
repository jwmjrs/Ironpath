name: Build Ironpath desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            command: pnpm exec electron-builder --publish never --mac --arm64
            artifact: release/*.dmg
          - os: windows-latest
            label: Windows
            command: pnpm exec electron-builder --publish never --win --x64
            artifact: release/*-setup.exe

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ironpath-${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish-release:
    name: Publish installers to GitHub Releases
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
